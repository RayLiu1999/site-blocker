<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網站已封鎖 — SiteFocus</title>
  <link rel="icon" href="icons/icon16.png" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="blocked">
    <img class="blocked-mark" src="icons/icon128.png" alt="" width="72" height="72" />

    <h1 class="blocked-title">先回到正事上</h1>
    <p class="blocked-site"><span id="blocked-domain">這個網站</span> 已被封鎖</p>
    <p class="blocked-status" id="blocked-schedule" hidden></p>

    <blockquote class="blocked-quote" id="blocked-quote"></blockquote>

    <div class="blocked-actions" id="blocked-actions">
      <button class="btn btn-solid" id="btn-back" type="button">返回上一頁</button>
      <button class="btn btn-ghost" id="btn-snooze" type="button">暫時解除封鎖</button>
    </div>

    <section class="unlock" id="cooldown-area" hidden aria-live="polite">
      <p class="unlock-text">先等 <strong id="cooldown-counter">30</strong> 秒，再決定是否真的需要這個網站。</p>
      <div class="unlock-bar"><span id="cooldown-bar"></span></div>
      <button class="btn btn-solid" id="btn-confirm-snooze" type="button" disabled>暫時解除封鎖</button>
    </section>

    <section class="unlock" id="password-area" hidden>
      <label class="unlock-text" for="password-input">輸入密碼以暫時解除封鎖</label>
      <div class="unlock-row">
        <input type="password" id="password-input" class="unlock-input" autocomplete="off" />
        <button class="btn btn-solid" id="btn-confirm-password" type="button">解除</button>
      </div>
      <p class="unlock-hint" id="password-hint" hidden></p>
      <p class="unlock-error" id="password-error" role="alert" hidden>密碼不正確，請再試一次。</p>
    </section>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
